{% extends "base.html" %}
{% block title %}Add Course{% endblock %}
{% block content %}
    {% if error %}
        <p style="color: red">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/add-review">
    <label>Course name: <input type="text" name="course_name"></label>
    <label>Rating: <input type="number" name="rating" step="0.1" min="1" max="5"></label>
    <label>Comment: <textarea name="comment"></textarea></label>
    <button type="submit">Add review</button>
    </form>
<a href="/courses">Back to all courses</a>
{% endblock %}
