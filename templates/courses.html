{% extends "base.html" %}
{% block title %}All Courses{% endblock %}
{% block content %}
    <h1>Courses</h1>
    <ul>
        {% for course in courses %}
           <li>
            {{ course.title }}   |
            {{ course.rating }}  |
            {{ course.students}} |
            {% if course.rating > 4.4 %} 
                ⭐ Top rated
            {% endif %}
           </li> 
           {% endfor %}
    </ul>
{% endblock %}
